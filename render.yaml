services:
  - type: web
    name: petshop-backend
    runtime: node
    rootDir: Back-End
    buildCommand: pnpm install --prod=false && pnpm prisma:generate && pnpm build
    startCommand: pnpm prisma:migrate && pnpm prisma:seed && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://petshop-front-end.onrender.com

  - type: static
    name: petshop-frontend
    rootDir: Front-End
    buildCommand: node scripts/generate-env.js
    staticPublishPath: .
    envVars:
      - key: API_URL
        value: https://petshop-back-end-wujv.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
